# SPDX-License-Identifier: MPL-2.0
# Developer build recipe; this file is never read by the running launcher.
# Required repositories only; their commits come from the pinned parent Git trees.
submodules = [
  "releng",
  "releng/meson",
  "releng/tomlkit",
  "subprojects/frida-core",
  "subprojects/frida-gum",
  "subprojects/frida-python",
  "subprojects/frida-python/frida-bindgen",
]

[frida]
repository = "https://github.com/frida/frida.git"
version = "17.23.3"
revision = "3c7ea1530edb0c3bb9b1de84444510163052b18a"
# Mark our wheel separately; the linked Core still reports version 17.23.3.
package_version = "17.23.3+modlauncher.1"
deps_version = "20261004"
setuptools_version = "80.9.0"
options = [
  "-Dfrida_python=enabled", "-Dfrida_tools=disabled", "-Dfrida_node=disabled",
  "-Dfrida_clr=disabled", "-Dfrida_swift=disabled", "-Dfrida_qml=disabled",
  "-Dgraft_tool=disabled", "-Dgadget=disabled", "-Dserver=disabled",
  "-Dportal=disabled", "-Dinject=disabled",
  "-Dfrida-core:local_backend=enabled", "-Dfrida-core:connectivity=disabled",
  "-Dfrida-core:fruity_backend=disabled", "-Dfrida-core:droidy_backend=disabled",
  "-Dfrida-core:socket_backend=disabled", "-Dfrida-core:barebone_backend=disabled",
  "-Dfrida-core:compiler_backend=disabled", "-Dfrida-core:assets=embedded",
  # Fail rather than silently omit architecture compatibility when tools are missing.
  "-Dfrida-core:compat=native,emulated",
  "-Dfrida-core:tests=disabled", "-Dfrida-gum:tests=disabled",
  "-Dfrida-gum:quickjs=enabled", "-Dfrida-gum:v8=disabled",
  # Core requires the inspector even with V8 disabled.
  "-Dfrida-gum:database=disabled", "-Dfrida-gum:inspector=enabled",
]

[targets]
windows-x86_64 = ["toolchain-windows-x86", "sdk-windows-x86_64-mt", "sdk-windows-x86-mt"]
linux-x86_64 = ["toolchain-linux-x86_64", "sdk-linux-x86_64", "sdk-linux-x86"]
macos-x86_64 = ["toolchain-macos-x86_64", "sdk-macos-x86_64"]
macos-arm64 = ["toolchain-macos-arm64", "sdk-macos-arm64", "sdk-macos-arm64e"]

