# SPDX-License-Identifier: MPL-2.0
name: Report test coverage

on:
  workflow_run:
    workflows: [Test suite]
    types: [completed]

permissions:
  actions: read

jobs:
  coverage:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Read reports only: never check out or execute code from the triggering PR.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the pytest run's coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: python-coverage*
          path: ${{ runner.temp }}/pytest-coverage
          merge-multiple: false
      - name: Summarize suite and platform coverage
        shell: python {0}
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/pytest-coverage
          TEST_RUN_URL: ${{ github.event.workflow_run.html_url }}
          TEST_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TEST_RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = {
              f"python-coverage-{suite}-{platform}": (label, platform_label)
              for suite, label in (
                  ("launcher", "Launcher"),
                  ("hook_manager", "Hook manager"),
                  ("career_preload", "Career loading"),
                  ("game_adapters", "Game adapters"),
                  ("personnel", "Personnel adapters"),
                  ("regulations", "Regulation adapters"),
                  ("projects", "Development projects"),
                  ("callables", "Private callable adapters"),
                  ("mod_runtime", "Mod runtime"),
                  ("mod_runtime_loading", "Source loading"),
                  ("ci", "CI helpers"),
                  ("integration_regulations", "Integration: regulations"),
                  ("integration_source_loading", "Integration: source loading"),
                  ("integration_session_lifetime", "Integration: session lifetime"),
              )
              for platform, platform_label in (("windows", "Windows x64"), ("linux", "Linux x64"))
          }
          reports["python-coverage-acceptance-windows"] = ("Runtime acceptance", "Windows x64")
          directory = Path(os.environ["REPORT_DIRECTORY"])
          conclusion = os.environ["TEST_RUN_CONCLUSION"]
          summary = [
              "## Python coverage",
              "",
              f"Scope: {os.environ['TEST_RUN_WORKFLOW']} (reports from this run only).",
              "",
              f"[Pytest run and downloadable XML/HTML reports]({os.environ['TEST_RUN_URL']})",
              "",
              f"Workflow definition commit: `{os.environ['TEST_RUN_SHA']}`; test result: **{conclusion}**.",
              "The tested PR head commit is recorded in the linked test run's claim summary and manual-ci status.",
              "",
              "Integration rows span components and overlap their reports; percentages remain separate.",
              "",
              "| Suite | Platform | Lines | Branches |",
              "| --- | --- | --- | --- |",
          ]
          errors = []

          def metric(root, kind):
              covered = int(root.attrib[f"{kind}-covered"])
              total = int(root.attrib[f"{kind}-valid"])
              if not 0 <= covered <= total:
                  raise ValueError("invalid coverage counts")
              return f"{covered / total:.2%} ({covered}/{total})" if total else "N/A (0/0)"

          for artifact, (suite, platform) in reports.items():
              report = directory / artifact / "coverage.xml"
              label = f"{suite} / {platform}"
              if not report.is_file():
                  summary.append(f"| {suite} | {platform} | Report unavailable | Report unavailable |")
                  errors.append(f"Missing coverage report for {label}")
                  continue
              try:
                  root = ET.parse(report).getroot()
                  if root.tag != "coverage":
                      raise ValueError("expected a coverage document")
                  lines, branches = metric(root, "lines"), metric(root, "branches")
              except (OSError, ET.ParseError, KeyError, ValueError):
                  errors.append(f"Invalid coverage report for {label}")
                  summary.append(f"| {suite} | {platform} | Invalid report | Invalid report |")
              else:
                  summary.append(f"| {suite} | {platform} | {lines} | {branches} |")

          summary += [
              "",
              "Each row describes one suite and platform's test selection; percentages are not added or averaged.",
              "Coverage measures the pytest process; isolated embedded processes are not instrumented.",
              "There is no fixed minimum coverage percentage. Review gaps alongside test behaviour.",
          ]
          text = "\n".join(summary) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(text, encoding="utf-8")
          if errors:
              raise SystemExit("; ".join(errors))
