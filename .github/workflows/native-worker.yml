# SPDX-License-Identifier: MPL-2.0
name: Native Core worker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install developer test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify the official devkit and compile the worker
        run: python -B native/core_worker/build.py
      - name: Test the real worker on owned processes
        env:
          TPM_REQUIRE_NATIVE_TESTS: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -B -m pytest tests/native_worker -p pytest_cov --cov=launcher.native_worker --cov-report=xml --cov-report=term-missing
      - name: Upload build and test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-worker-evidence-${{ matrix.runner }}
          path: |
            libs/core_worker/**/worker.toml
            coverage.xml
          if-no-files-found: error
