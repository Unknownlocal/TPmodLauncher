# SPDX-License-Identifier: MPL-2.0
name: Test mod runtime

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  loading:
    if: ${{ github.run_attempt == '1' }}
    uses: ./.github/workflows/test-mod-runtime-loading.yml
    with:
      ref: ${{ inputs.ref }}

  test:
    if: ${{ github.run_attempt == '1' }}
    uses: ./.github/workflows/portable.yml
    with:
      ref: ${{ inputs.ref }}
      suite: mod_runtime
