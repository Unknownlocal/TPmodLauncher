# SPDX-License-Identifier: MPL-2.0
name: Portable suite tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      suite:
        type: string
        required: true

permissions:
  contents: read

jobs:
  portable:
    if: ${{ github.run_attempt == '1' }}
    name: ${{ inputs.suite }} / ${{ matrix.platform.id }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows
            runner: windows-latest
            python: .venv/Scripts/python.exe
          - id: linux
            runner: ubuntu-24.04
            python: .venv/bin/python
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download the prepared platform dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-dependencies-${{ matrix.platform.id }}
          path: wheelhouse
      - name: Create the developer test environment from prepared wheels
        run: |
          python -m venv .venv
          "${{ matrix.platform.python }}" -m pip install --no-index --find-links wheelhouse -r requirements-dev.txt
      - name: Read the selected suite's shared-input requirements
        id: requirements
        run: |
          runner=$("${{ matrix.platform.python }}" -B .github/ci_tests.py --suite "${{ inputs.suite }}" --needs-runner)
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
      - name: Download this workflow's portable runner
        if: ${{ steps.requirements.outputs.runner == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trusted-python-runner
          path: libs/mod-runners
      - name: Check ownership of every portable test
        if: ${{ inputs.suite == 'ci' }}
        run: '"${{ matrix.platform.python }}" -B .github/ci_tests.py --suite check -q'
      - name: Run the selected suite
        env:
          TPM_TEST_RUNNER_BUNDLE: ${{ github.workspace }}/libs/mod-runners
          TPM_REQUIRE_SHARED_RUNNER: '1'
        run: |
          exec "${{ matrix.platform.python }}" -B .github/ci_tests.py --suite "${{ inputs.suite }}" --coverage -v --junitxml=junit.xml -p pytest_cov --cov-report=xml --cov-report=html
      - name: Preserve raw coverage and test results, including failed runs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data-${{ matrix.platform.id }}-${{ inputs.suite }}
          include-hidden-files: true
          path: |
            .coverage
            junit.xml
          if-no-files-found: warn
      - name: Upload suite coverage
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ inputs.suite }}-${{ matrix.platform.id }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
