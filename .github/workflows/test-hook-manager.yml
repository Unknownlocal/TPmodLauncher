# SPDX-License-Identifier: MPL-2.0
name: Test hook manager

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  game-adapters:
    if: ${{ github.run_attempt == '1' }}
    uses: ./.github/workflows/test-game-adapters.yml
    with:
      ref: ${{ inputs.ref }}

  career:
    if: ${{ github.run_attempt == '1' }}
    uses: ./.github/workflows/test-career-discovery.yml
    with:
      ref: ${{ inputs.ref }}

  test:
    if: ${{ github.run_attempt == '1' }}
    uses: ./.github/workflows/portable.yml
    with:
      ref: ${{ inputs.ref }}
      suite: hook_manager
