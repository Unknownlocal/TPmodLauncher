# SPDX-License-Identifier: MPL-2.0
name: Test launcher

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  diagnostics:
    if: ${{ github.run_attempt == '1' }}
    uses: ./.github/workflows/test-launcher-diagnostics.yml
    with:
      ref: ${{ inputs.ref }}

  test:
    if: ${{ github.run_attempt == '1' }}
    uses: ./.github/workflows/portable.yml
    with:
      ref: ${{ inputs.ref }}
      suite: launcher
