# SPDX-License-Identifier: MPL-2.0
name: Prepare developer dependencies

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.run_attempt == '1' }}
    name: Prepare dependencies / ${{ matrix.platform.id }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows
            runner: windows-latest
          - id: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          # Dispatch runs use main's cache scope, so PR code must not share a pip cache.
      - name: Prepare wheels for every developer requirement and dependency
        run: python -m pip wheel --wheel-dir wheelhouse -r requirements-dev.txt
      - name: Share the platform's wheels within this workflow run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-dependencies-${{ matrix.platform.id }}
          path: wheelhouse/*.whl
          retention-days: 1
          # Wheels are already compressed ZIP archives.
          compression-level: 0
          if-no-files-found: error
