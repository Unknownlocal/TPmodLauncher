# SPDX-License-Identifier: MPL-2.0
name: Prepare developer dependencies

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      pr_number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.run_attempt == '1' }}
    name: Prepare dependencies / ${{ matrix.platform.id }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows
            runner: windows-latest
            setup_cache_os_suffix: ''
          - id: linux
            runner: ubuntu-24.04
            setup_cache_os_suffix: '-24.04-Ubuntu'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.13'
          architecture: x64
      - name: Locate the pip cache
        id: pip-cache
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          directory = subprocess.check_output([sys.executable, '-m', 'pip', 'cache', 'dir'], text=True).strip()
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'directory={directory}\n')
      - name: Restore and preserve pip downloads and built wheels
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pip-cache.outputs.directory }}
          key: pr-pip-v1-${{ matrix.platform.id }}-x64-python-${{ steps.python.outputs.python-version }}-pr-${{ inputs.pr_number }}-${{ hashFiles('requirements-dev.txt') }}
          # Reuse this PR's cache, then seed from the existing setup-python cache.
          # Saves use the pr-pip key, preserving the release workflow's cache keys.
          restore-keys: |
            pr-pip-v1-${{ matrix.platform.id }}-x64-python-${{ steps.python.outputs.python-version }}-pr-${{ inputs.pr_number }}-
            setup-python-${{ runner.os }}-x64${{ matrix.platform.setup_cache_os_suffix }}-python-${{ steps.python.outputs.python-version }}-pip-${{ hashFiles('requirements-dev.txt') }}
      - name: Prepare wheels for every developer requirement and dependency
        run: python -m pip wheel --wheel-dir wheelhouse -r requirements-dev.txt
      - name: Share the platform's wheels within this workflow run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-dependencies-${{ matrix.platform.id }}
          path: wheelhouse/*.whl
          retention-days: 1
          # Wheels are already compressed ZIP archives.
          compression-level: 0
          if-no-files-found: error
