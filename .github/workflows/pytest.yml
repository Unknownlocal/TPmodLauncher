# SPDX-License-Identifier: MPL-2.0
name: Test Windows runtime

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-bundle:
    name: Prepare Windows player bundle
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download the prepared Windows dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-dependencies-windows
          path: wheelhouse
      - name: Create the developer build environment from prepared wheels
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --no-index --find-links wheelhouse -r requirements-dev.txt
      - name: Prepare and verify the official Windows dependency profile
        run: |
          .venv/Scripts/python.exe -B -m mod_runtime.build --output libs/mod-runners
          .venv/Scripts/python.exe -I launcher/prepare_release.py --lockfile pylock.stock.toml --refresh-manifest
          libs/python-3.13.16-embed-amd64/python.exe -B launcher/entry.py --check-only
      - name: Share the verified bundle within this workflow run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-player-bundle
          retention-days: 1
          include-hidden-files: true
          path: |
            libs/python-3.13.16-embed-amd64
            libs/vendor
            libs/mod-runners
            bundled_packages.toml
          if-no-files-found: error

  windows-acceptance:
    name: windows / ${{ matrix.suite }}
    needs: windows-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: embedded
            selection: embedded and not native and not frida_build
          - suite: native
            selection: native and not frida_build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TPM_REQUIRE_EMBEDDED_TESTS: '1'
      TPM_REQUIRE_NATIVE_TESTS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download the prepared Windows dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-dependencies-windows
          path: wheelhouse
      - name: Create the developer test environment from prepared wheels
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --no-index --find-links wheelhouse -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-player-bundle
      - name: Verify the downloaded player bundle
        run: libs/python-3.13.16-embed-amd64/python.exe -B launcher/entry.py --check-only
      - name: Run player acceptance
        run: |
          exec .venv/Scripts/python.exe -B -m pytest tests -v -m "${{ matrix.selection }}" --junitxml=junit.xml -p pytest_cov --cov --cov-report=
      - name: Preserve acceptance results and coverage, including failed runs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data-windows-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            .coverage
            junit.xml
          if-no-files-found: warn

  coverage:
    name: Combine Windows acceptance coverage
    needs: windows-acceptance
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Combination runs in the unprivileged test workflow; the reporting workflow reads XML only.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download the prepared Linux dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-dependencies-linux
          path: wheelhouse
      - name: Install the pinned coverage tool from prepared wheels
        shell: bash
        run: |
          python -c 'from pathlib import Path; print(next(line for line in Path("requirements-dev.txt").read_text().splitlines() if line.startswith("coverage==")))' > "$RUNNER_TEMP/coverage-requirement.txt"
          python -m pip install --no-index --find-links wheelhouse -r "$RUNNER_TEMP/coverage-requirement.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-data-windows-*
          path: .cache/ci-input
          merge-multiple: false
      - name: Combine complete platform reports
        run: python -B .github/ci_coverage.py --input .cache/ci-input --output .cache/ci-coverage
      - name: Upload Windows coverage
        if: ${{ !cancelled() && hashFiles('.cache/ci-coverage/windows/coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-acceptance-windows
          path: |
            .cache/ci-coverage/windows/coverage.xml
            .cache/ci-coverage/windows/htmlcov/
          if-no-files-found: error

  complete:
    name: Windows runtime complete
    needs: [windows-bundle, windows-acceptance, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test and reporting job to succeed
        shell: python {0}
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [f"{name}: {job['result']}" for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required jobs did not succeed: " + "; ".join(failed))
          print("Every required test and coverage job succeeded.")
